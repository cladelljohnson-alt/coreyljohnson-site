name: Scheduled posts

# Manual only (D15). No daily schedule, and this workflow does not push to main.
# The old steps targeted index.html and pushed to main. They are retired.
# Publish posts with npm run build-blog, build-blog-index, and build-sitemap, then open a pull request.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-scheduled-post:
    runs-on: ubuntu-latest
    steps:
      - name: Scheduled publishing is retired
        run: |
          echo "This workflow is manual-only and does not publish or push to main."
          echo "Use npm run build-blog, npm run build-blog-index, and npm run build-sitemap, then open a pull request."
